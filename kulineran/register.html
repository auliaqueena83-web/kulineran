<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar — KULINERAN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">

<header class="site-header">
  <div class="wrap header-inner">
    <a class="logo" href="index.html" aria-label="KULINERAN — beranda">
      <span class="logo-mark" aria-hidden="true">
        <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="20" cy="20" r="19" stroke="currentColor" stroke-width="2"/>
          <path d="M12 15C12 15 14 11 20 11C26 11 28 15 28 15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M11 20H29" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M13 20C13 20 13 27 20 27C27 27 27 20 27 20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="logo-text">KULINERAN</span>
    </a>
    <nav class="main-nav" aria-label="Navigasi utama">
      <a href="index.html#feed">Jelajahi</a>
      <a href="index.html#cara-kerja">Cara Kerja</a>
      <a href="index.html#tentang">Tentang</a>
    </nav>
    <div class="header-actions">
      <a class="btn btn-ghost" href="login.html">Masuk</a>
    </div>
  </div>
</header>

<main class="auth-main">
  <div class="auth-wrap">
    <div class="auth-card">
      <p class="eyebrow eyebrow-dark">gabung sekarang</p>
      <h1 class="auth-title">Bikin akun KULINERAN</h1>
      <p class="auth-sub">Daftar dulu biar bisa mulai posting foto atau video makananmu sendiri.</p>

      <form class="auth-form" id="registerForm" novalidate>
        <div class="field">
          <label for="regName">Nama lengkap</label>
          <input type="text" id="regName" name="regName" placeholder="Nama kamu" autocomplete="name" required>
          <span class="field-error" id="regNameError" hidden></span>
        </div>

        <div class="field">
          <label for="regUsername">Username</label>
          <input type="text" id="regUsername" name="regUsername" placeholder="@namakamu" autocomplete="username" required>
          <span class="field-error" id="regUsernameError" hidden></span>
        </div>

        <div class="field">
          <label for="regEmail">Email</label>
          <input type="email" id="regEmail" name="regEmail" placeholder="kamu@email.com" autocomplete="email" required>
          <span class="field-error" id="regEmailError" hidden></span>
        </div>

        <div class="field">
          <label for="regPassword">Kata sandi</label>
          <div class="password-wrap">
            <input type="password" id="regPassword" name="regPassword" placeholder="Minimal 8 karakter" autocomplete="new-password" required minlength="8">
            <button type="button" class="password-toggle" data-target="regPassword" aria-label="Tampilkan kata sandi">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M2 12C2 12 5.5 5.5 12 5.5C18.5 5.5 22 12 22 12C22 12 18.5 18.5 12 18.5C5.5 18.5 2 12 2 12Z" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/></svg>
            </button>
          </div>
          <span class="field-error" id="regPasswordError" hidden></span>
        </div>

        <div class="field">
          <label for="regPasswordConfirm">Ulangi kata sandi</label>
          <div class="password-wrap">
            <input type="password" id="regPasswordConfirm" name="regPasswordConfirm" placeholder="Ketik ulang kata sandi" autocomplete="new-password" required>
            <button type="button" class="password-toggle" data-target="regPasswordConfirm" aria-label="Tampilkan kata sandi">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M2 12C2 12 5.5 5.5 12 5.5C18.5 5.5 22 12 22 12C22 12 18.5 18.5 12 18.5C5.5 18.5 2 12 2 12Z" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/></svg>
            </button>
          </div>
          <span class="field-error" id="regPasswordConfirmError" hidden></span>
        </div>

        <label class="checkbox-row">
          <input type="checkbox" id="agreeTerms" required>
          <span>Saya setuju sama syarat & ketentuan KULINERAN</span>
        </label>

        <p class="form-msg" id="registerMsg" hidden></p>

        <button class="btn btn-primary btn-lg btn-block" type="submit">Daftar</button>
      </form>

      <p class="auth-switch">Sudah punya akun? <a href="login.html">Masuk di sini</a></p>
    </div>

    <div class="auth-visual" aria-hidden="true">
      <div class="auth-collage">
        <div class="collage-card card-a"><div class="collage-media grad-4">🍜</div></div>
        <div class="collage-card card-b"><div class="collage-media grad-3">🍧</div></div>
        <div class="collage-card card-c"><div class="collage-media grad-2">🍢</div></div>
      </div>
      <p class="auth-visual-text">"Sosmed untuk siapa aja yang doyan pamer makanan."</p>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap footer-bottom">
    <p>&copy; 2026 KULINERAN. Dibuat buat yang laper mata.</p>
  </div>
</footer>

<script src="auth.js"></script>
</body>
</html>
